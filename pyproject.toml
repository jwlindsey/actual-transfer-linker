[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "actual-transfer-linker"
version = "0.1.0"
description = "Link the two sides of money moved between your own accounts in Actual Budget as one transfer"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "jwlindsey" }]
dependencies = ["actualpy>=0.22", "PyYAML>=6"]

[project.urls]
Homepage = "https://github.com/jwlindsey/actual-transfer-linker"
Issues = "https://github.com/jwlindsey/actual-transfer-linker/issues"

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
actual-transfer-linker = "actual_transfer_linker.cli:main"

[tool.setuptools]
packages = ["actual_transfer_linker"]
